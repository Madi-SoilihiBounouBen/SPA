<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Calendrier SPA</title>
    <link rel="stylesheet" href="/public/spa.css">
</head>
<body>

    <!-- Navigation -->
    <div class="top-buttons">
        <button id="btnSpa">SPA</button>
        <button id="btnCalendrier">Calendrier</button>
    </div>

    <!-- Titre -->
    <div class="title">
      📆  Calendrier SPA 📆
    </div>

    <!-- Switch vue -->
    <div class="view-switch">
        <button data-view="month">Mois</button>
        <button data-view="week">Semaine</button>
        <button data-view="day" id="jour">Jour</button>
    </div>

    <!-- Navigation mois -->
    <div class="month-navigation">
        <button id="prevMonth">◀</button>
        <div id="currentMonth">Février 2026</div>
        <button id="nextMonth">▶</button>
    </div>

    <!-- Calendrier -->
    <div id="calendar"></div>

    <script src="/public/spa.js"></script>
</body>
</html>
